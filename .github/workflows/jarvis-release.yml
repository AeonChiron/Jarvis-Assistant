# Jarvis Assistant's releases: every push to main that changes the app builds the Windows installer, signs its update
# bundle with Jarvis Assistant's own key (TAURI_SIGNING_PRIVATE_KEY secret; the public half is plugins.updater.pubkey in
# tauri.conf.json) and publishes it as a release with latest.json, the feed the installed app updates itself from.
# Versions are 0.2.<run number>, so each one is newer than the last (and than Roamies 0.1.x it started from).
name: Jarvis release

on:
  push:
    branches: [main]
    paths: ['showcase/**', '.github/workflows/jarvis-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-release
  cancel-in-progress: false

jobs:
  # Nothing is published unless these pass: the sidecar's tests, a syntax check of every file (tests don't load them
  # all) and both brain bundles built exactly as the app ships them. On Windows, the only system Jarvis ships for.
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: showcase/tauri/sidecar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        run: npm ci

      - name: Syntax check every sidecar file
        run: for f in *.mjs; do node --check "$f"; done

      - name: Bundle the brain and the agent runner as the build does
        run: ./bundle.sh

      - name: Test sidecar
        run: npm test

  release:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: showcase/tauri
    env:
      VER: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: showcase/tauri/sidecar
        run: npm ci

      - name: Test sidecar
        working-directory: showcase/tauri/sidecar
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            showcase/tauri/src-tauri -> target
            showcase/tauri/src-tauri/voice-win -> target
            showcase/tauri/src-tauri/hands-win -> target

      - name: Test the voice helper
        working-directory: showcase/tauri/src-tauri/voice-win
        run: cargo test --release --locked

      - name: Test the hands helper
        working-directory: showcase/tauri/src-tauri/hands-win
        run: cargo test --release --locked

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installer and its signed update bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build.sh release --target x86_64-pc-windows-msvc --bundles nsis --config "{\"version\":\"$VER\"}"

      - name: Publish the release and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR=src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          SETUP=$(ls "$DIR"/*_"$VER"_x64-setup.exe)
          NAME=$(basename "$SETUP"); FILE=$(echo "$NAME" | tr ' ' '.')
          cp "$SETUP" "$RUNNER_TEMP/$FILE"; cp "$SETUP.sig" "$RUNNER_TEMP/$FILE.sig"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VER/$FILE"
          SIG="$(cat "$RUNNER_TEMP/$FILE.sig")" URL="$URL" node -e '
            const { VER, SIG, URL } = process.env;
            const out = { version: VER, notes: `Jarvis Assistant ${VER}`, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: SIG, url: URL } } };
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/latest.json", JSON.stringify(out, null, 2));'
          gh release create "v$VER" "$RUNNER_TEMP/$FILE" "$RUNNER_TEMP/$FILE.sig" "$RUNNER_TEMP/latest.json" \
            --title "Jarvis Assistant $VER" --notes "$(git log -1 --pretty=%B)" --target "$GITHUB_SHA"
